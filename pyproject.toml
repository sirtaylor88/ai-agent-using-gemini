[project]
name = "ai-agent-using-gemini"
version = "0.1.0"
description = "Add your description here"
authors = [
    {name = "Nhat Tai NGUYEN",email = "nhattai.nguyen88@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "google-genai==1.12.1",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pydocstyle>=6.3.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "calculator/*"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "calculator"]
skips = ["B404", "B603", "B607"]

[tool.pydocstyle]
convention = "google"
match_dir = "(?!\\.venv|calculator)"
add_ignore = ["D417"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["calculator/", ".venv/"]

[[tool.mypy.overrides]]
module = ["main", "utils"]
ignore_errors = true
